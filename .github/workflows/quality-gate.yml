name: Agent quality gate
on:
  pull_request:
    paths:
      - '06-lab-complete/benchmark-observability/develop/**'
      - '.github/workflows/quality-gate.yml'
  workflow_dispatch:
jobs:
  eval-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt
      - run: pip install -r requirements.txt
      - name: Start deterministic v2 agent
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 python app.py > /tmp/agent.log 2>&1 &
          echo $! > /tmp/agent.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/agent.log
          exit 1
      - name: Run golden dataset quality gate
        run: python eval/run_eval.py --url http://127.0.0.1:8000 --min-accuracy 1.0
      - name: Stop agent
        if: always()
        run: if [ -f /tmp/agent.pid ]; then kill -TERM "$(cat /tmp/agent.pid)" || true; fi
